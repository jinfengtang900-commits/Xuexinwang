<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学信档案</title>
<style>
:root{--green:#23b186;--ink:#333;--muted:#929292;--frame:min(92%,980px);--foot:48px}
*{box-sizing:border-box}
body{margin:0;background:#fdfdfd;color:var(--ink);font:16px/1.45 system-ui,"Microsoft YaHei",sans-serif}
button,a,summary{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--green);text-decoration:none}
:focus-visible{outline:2px solid #165ec4;outline-offset:4px}
[hidden]{display:none!important}
.chrome{position:sticky;top:0;z-index:5;background:#ededed;color:#171717;text-align:center;padding:9px 0 8px}
.chrome strong{display:block;font-size:19px}
.chrome small{display:block;font-size:11px;color:#555}
.chrome small a{color:inherit}
main{width:var(--frame);margin:auto;padding-bottom:calc(var(--foot) + 25px)}
.bar{position:relative;display:grid;place-items:center;min-height:clamp(52px,7.7vw,72px);margin:0;text-align:center;font-size:clamp(16px,2.3vw,23px);font-weight:600}
.green{color:white;background:var(--green)}
.brand{container-type:inline-size;min-height:52px;aspect-ratio:1500/127;background:#26b887}
.brand::before{content:"";position:absolute;z-index:1;top:0;left:calc(50% - 50vw);width:88.17vw;height:clamp(2px,.366vw,4px);background:#00bf12;pointer-events:none}
.brand-logo{display:block;width:clamp(104px,20.53cqw,208px);height:auto}
.brand .exit{inset:0 1.35% 0 auto;display:grid;place-items:center;width:max(44px,6.2cqw)}
.brand .exit img{display:block;width:clamp(19px,3.2cqw,34px);height:auto;transform:translateY(.37cqw)}
.bar button{position:absolute;inset:0 auto 0 0;width:48px;font-size:27px}
.inner{width:94%;margin:auto}
.promo{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f4f4f4;border-radius:10px;margin:17px auto 0;padding:clamp(18px,4vw,36px) clamp(12px,2.4vw,25px);font-size:clamp(17px,3.2vw,27px)}
.promo span{margin-left:clamp(0px,6vw,75px)}
.pill,.tag{color:#fff;border-radius:999px;white-space:nowrap}
.pill{background:var(--green);padding:.4em 1.3em;font-size:.75em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:clamp(18px,4.5vw,40px);padding-top:clamp(27px,5vw,47px);padding-bottom:74px}
.tile{text-align:center;font-size:clamp(13px,2.25vw,23px);line-height:1.4}
.tile svg,.tabs svg{display:block;margin:0 auto;color:var(--green);width:clamp(31px,5.2vw,50px);height:clamp(31px,5.2vw,50px);margin-bottom:9px}
.tile .blue{color:#2687df}.tile .yellow{color:#ffb600}
.dock{position:fixed;inset:auto 0 0;z-index:4}
.tabs,.history{display:flex;justify-content:center;background:#fdfdfd;border-top:1px solid #e2e2e2}
.tabs button{width:20%;font-size:clamp(10px,1.5vw,14px);padding:5px 0;color:#767879}
.tabs svg{width:26px;height:26px;margin-bottom:2px;color:inherit}
.tabs .active{color:var(--green)}
.history{height:var(--foot);gap:35px;background:#f5f5f5;padding-bottom:env(safe-area-inset-bottom)}
.history button{width:54px;font-size:25px}
button:disabled{opacity:.34;cursor:default}
.banner{position:relative;overflow:hidden;isolation:isolate;margin:clamp(12px,2.1vw,20px) 0 clamp(14px,2.7vw,27px);height:clamp(68px,13vw,140px);border-radius:10px;padding:clamp(9px,2.8vw,25px) clamp(12px,3vw,30px);background:#62a6ed;color:white}
.banner strong{display:block;font-size:clamp(21px,4.4vw,41px);line-height:1.15}
.banner p{margin:.38em 0 0;font-size:clamp(10px,2.15vw,21px);font-weight:700}
.banner svg{position:absolute;z-index:-1;right:0;bottom:0;width:39%;height:100%}
.banner.violet{background:#dcd5f1;color:#4051c4;margin-bottom:14px}
.group{margin:0 0 clamp(18px,3.5vw,32px)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin:0 0 10px}
.section-head h2{font-size:clamp(16px,2.75vw,25px);margin:0}
.section-head span{color:var(--muted);font-size:clamp(11px,1.95vw,19px)}
.text-button{color:#198d6d}
.card{display:block;text-align:left;width:100%;border-radius:8px;padding:clamp(14px,2.8vw,25px);background:linear-gradient(102deg,#1da978,#3cc38a);color:white;box-shadow:0 6px 10px #16a97738}
.card + .card{margin-top:clamp(9px,1.7vw,16px)}
.card.blue-card{background:linear-gradient(100deg,#3785ed,#62b0f4);box-shadow:0 6px 10px #3588e838}
.card.cyan-card{background:linear-gradient(100deg,#31afc2,#59c9da);box-shadow:0 6px 10px #25a9bf38}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(17px,3.1vw,29px)}
.tag{background:#006e4d65;padding:.12em .68em;font-size:clamp(11px,1.95vw,18px)}
.blue-card .tag{background:#00458465}
.card-meta{margin-top:.55em;font-size:clamp(12px,2.15vw,20px)}
.degree{border-radius:8px;box-shadow:0 2px 10px #0001;text-align:center;background:white;font-size:clamp(14px,2.9vw,26px)}
.degree p{padding:clamp(16px,4.3vw,39px) 12px;margin:0}
.degree details{border-top:1px solid #eee;color:#198d6d;font-size:.8em}
.degree summary{cursor:pointer;padding:.72em;list-style:none}
.degree summary::-webkit-details-marker{display:none}
.degree details[open] .chevron{display:inline-block;transform:rotate(180deg)}
.degree details p{color:var(--muted);padding:0 12px 14px}
.mark{color:var(--muted);font-size:.8em}
.profile{background:linear-gradient(#1ba879,#3bc68c);padding:clamp(15px,3.3vw,30px)}
.photos{display:flex;align-items:flex-start;gap:clamp(6px,3vw,25px);margin-bottom:clamp(18px,4vw,34px)}
figure{margin:0;flex:0 0 clamp(44px,12vw,112px);text-align:center;font-size:clamp(10px,1.6vw,14px)}
.portrait{display:grid;place-items:center;width:100%;aspect-ratio:3/4;border:1px solid #fff8;border-radius:8px;overflow:hidden;background:#e8e8e8;color:#d7d7d7}
.portrait.upload{background:#2e87a9;color:#b4d9e6}
.portrait svg{width:75%;height:75%}
.portrait img{width:100%;height:100%;object-fit:cover}
figcaption{margin-top:4px}
.person{padding-top:clamp(1px,1.4vw,12px);font-size:clamp(10px,2.2vw,20px)}
.person strong{display:block;font-size:clamp(16px,3vw,28px);font-weight:400}
.records{width:min(100%,680px);margin:clamp(20px,4.4vw,40px) auto;border-collapse:collapse;font-size:clamp(13px,2.5vw,24px)}
.records th,.records td{padding:.5em 0;vertical-align:top}
.records th{width:39%;text-align:right;color:var(--muted);font-weight:400;padding-right:clamp(12px,3.4vw,30px);white-space:nowrap}
.records td{overflow-wrap:anywhere}
.report{display:block;padding:.85em;text-align:center;border-radius:3px;font-size:clamp(16px,2.9vw,26px)}
dialog{width:min(88%,440px);padding:20px;border:0;border-radius:10px;color:var(--ink);box-shadow:0 8px 40px #0003}
dialog::backdrop{background:#0005}
dialog button{display:block;margin:10px 0 0 auto;color:#198d6d}
</style>
</head>

<script>
const routes = ['home', 'education', 'detail'];
const icon = (name, color = '') => `<svg class="${color}" aria-hidden="true"><use href="#${name}"/></svg>`;
const textIcon = (label, color = '') => `<svg class="${color}" viewBox="0 0 48 48" aria-hidden="true"><rect x="1" y="5" width="46" height="38" rx="11" fill="currentColor"/><text x="24" y="29" text-anchor="middle" font-size="15" fill="white">${label}</text></svg>`;
const tiles = [
  ['高等教育信息', icon('cap'), 'education'], ['在线验证报告', icon('shield')],
  ['学历学位认证<br>与成绩验证', icon('id-card')], ['出国（境）报告<br>发送', icon('globe','blue')],
  ['毕业证书图像<br>校对', icon('user')], ['就业', textIcon('Offer')],
  ['学校满意度', icon('smile','yellow')], ['个人测评', icon('clip','blue')],
  ['“双千”计划<br>“微专业”', textIcon('双千','blue')]
];
const tabs = [
  ['首页','home-icon','home'], ['学籍学历学位','cap','education'],
  ['个人测评','clip'], ['求职招聘','job'], ['我的','user']
];
const routeAttr = route => route ? `data-go="${route}"` : 'data-demo';
document.querySelector('.tiles').innerHTML = tiles.map(([label, svg, route]) =>
  `<button class="tile" ${routeAttr(route)}>${svg}${label}</button>`).join('');
document.querySelector('.tabs').innerHTML = tabs.map(([label, svg, route]) =>
  `<button ${routeAttr(route)}>${icon(svg)}${label}</button>`).join('');

const card = (school, badge, meta, color = '', route) =>
  `<button class="card ${color}" ${routeAttr(route)}><span class="card-title">${school}${badge ? `<span class="tag">${badge}</span>` : ''}</span><span class="card-meta" style="display:block">${meta}</span></button>`;
const group = (title, category, content) => `<section class="group"><header class="section-head"><h2>${title}</h2>${category ? `<span>还有${category}没有显示出来？ <button class="text-button" data-demo>尝试绑定</button></span>` : ''}</header>${content}</section>`;
document.querySelector('#education-groups').innerHTML = [
  group('学籍信息 (2)', '学籍',
    card('南京理工大学','硕士研究生','环境工程　|　全日制','','detail') +
    card('常州大学','本科','环境工程　|　普通全日制')),
  group('学历信息 (1)', '学历',
    card('常州大学','本科','环境工程　|　普通全日制','blue-card')),
  group('学位信息', '学位', `<div class="degree"><p>您还未绑定学位信息，可以使用“尝试绑定学位”功能绑定您的学位 <button class="mark" data-demo aria-label="学位绑定帮助">ⓘ</button></p><details><summary>提示信息 <span class="chevron">⌄</span></summary><p>可通过页面右上方的“尝试绑定”前往学信网。</p></details></div>`),
  group('考研信息 (1)', '', card('南京理工大学','','2026年','cyan-card','detail'))
].join('');

const prev = document.querySelector('#prev');
const next = document.querySelector('#next');
const tabsBar = document.querySelector('.tabs');
const notice = document.querySelector('#notice');
const offsets = new Map();
let current;
function render(route, restore = false) {
  if (current) offsets.set(current, scrollY);
  current = routes.includes(route) ? route : 'home';
  for (const id of routes) document.getElementById(id).hidden = id !== current;
  tabsBar.hidden = current !== 'home';
  tabsBar.querySelector('[data-go="home"]').classList.add('active');
  const index = routes.indexOf(current);
  prev.disabled = index === 0;
  next.disabled = index === routes.length - 1;
  scrollTo(0, restore ? offsets.get(current) || 0 : 0);
}
function navigate(route, restore = false) {
  if (!route || route === current) return;
  history.pushState(null, '', '#' + route);
  render(route, restore);
}
history.scrollRestoration = 'manual';
window.addEventListener('popstate', () => render(location.hash.slice(1), true));
prev.addEventListener('click', () => navigate(routes[routes.indexOf(current) - 1], true));
next.addEventListener('click', () => navigate(routes[routes.indexOf(current) + 1]));
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.go) navigate(button.dataset.go);
  if (button.dataset.back) navigate(button.dataset.back, true);
  if (button.hasAttribute('data-demo')) notice.showModal();
});

const photo = document.querySelector('#photo');
const input = document.querySelector('#photo-input');
let photoURL;
photo.addEventListener('click', () => input.click());
input.addEventListener('change', () => {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.alt = '录取照片';
  img.onload = () => {
    if (photoURL) URL.revokeObjectURL(photoURL);
    photoURL = url;
    photo.replaceChildren(img);
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
});
render(location.hash.slice(1));
</script>
</body>
